name: Mutants

# 变异测试：验证「测试对实现缺陷敏感」（FSVDD 证伪原则的自动化替代）。
# 全量运行耗时较长，采用「每周定时 + 手动触发」而非每次提交运行。
# 配置：mutants.toml；报告：Artifacts → mutants-report

on:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants（全量）
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: 运行变异测试
        run: cargo mutants --workspace
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
