# mycelium 工作区清单。
# 依赖策略：只引入经过论证的第三方依赖，理由登记于 docs/architecture/overview.md §9。
[workspace]
resolver = "3"
members = [
    "crates/mycelium",
    "crates/mycelium-core",
    "crates/mycelium-macros",
    "crates/mycelium-mcp",
    "crates/mycelium-model",
    "crates/mycelium-provider-openai",
    "crates/mycelium-runtime",
    "crates/mycelium-tools",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# MSRV：以已在 stable 1.97.1 完成验证的最低次版本声明，不得声称未验证的支持范围。
rust-version = "1.97"
repository = "https://github.com/oxroot-crypto/mycelium"
# readme：各 crate 目录内的 README.md（门面与根 README 保持一致）。
readme = "README.md"
# 注意：`publish` 自 v1.0.0 起开放；任何发布必须先完成 release-process.md §2 检查单
# （版本号 / CHANGELOG / 联调日志 / 全量验证），并按 §4 依赖拓扑顺序执行
# （v1.0.0 步骤见 docs/architecture/release-v1.0-runbook.md）。

[workspace.dependencies]
mycelium-agent-core = { path = "crates/mycelium-core", version = "1.1.0" }
mycelium-agent-macros = { path = "crates/mycelium-macros", version = "1.1.0" }
mycelium-agent-mcp = { path = "crates/mycelium-mcp", version = "1.1.0" }
mycelium-agent-model = { path = "crates/mycelium-model", version = "1.1.0" }
mycelium-agent-provider-openai = { path = "crates/mycelium-provider-openai", version = "1.1.0" }
mycelium-agent-runtime = { path = "crates/mycelium-runtime", version = "1.1.0" }
mycelium-agent-tools = { path = "crates/mycelium-tools", version = "1.1.0" }

async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
proptest = "1"# 禁用默认 TLS 后端（aws-lc-rs 需要 cmake），改用 rustls + ring（仅需 C 编译器）。
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# 发布构建：以运行时性能与产物体积为先，代价是编译时间（骨架阶段影响可忽略）。
[profile.release]
lto = "thin"
codegen-units = 1
