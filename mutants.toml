# cargo-mutants 配置（变异测试）。
# 运行方式：每周定时 + 手动触发（见 .github/workflows/mutants.yml）；
# 本地完整运行耗时较长，建议用 --file 限定模块，例如：
#   cargo mutants -f crates/mycelium-core/src/config.rs

# 变异目标是生产逻辑：排除测试与示例代码。
exclude_globs = [
    "crates/*/tests/**",
    "crates/*/examples/**",
]

# CI 机器较慢：放宽测试超时倍率与下限。
timeout_multiplier = 2.0
minimum_test_timeout = 20.0
