[package]
name = "mycelium-agent-provider-openai"
description = "mycelium 的 OpenAI 兼容 Provider 实现（Chat Completions，流式 SSE）"
keywords = ["openai", "llm", "agent", "provider"]
categories = ["api-bindings", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# 发布名与导入名解耦：crates.io 包名为 mycelium-agent-provider-openai，`use` 导入名保持 mycelium_provider_openai。
[lib]
name = "mycelium_provider_openai"

[lints]
workspace = true

[dependencies]
mycelium-agent-core.workspace = true
mycelium-agent-model.workspace = true
futures-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
mycelium-agent-runtime.workspace = true
mycelium-agent-tools.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
