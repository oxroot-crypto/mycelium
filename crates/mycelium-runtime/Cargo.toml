[package]
name = "mycelium-agent-runtime"
description = "mycelium 执行引擎：AgentRuntime 装配、会话与运行钩子（执行循环自 v0.2 起实现）"
keywords = ["agent", "runtime", "async", "sessions"]
categories = ["development-tools", "asynchronous"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# 发布名与导入名解耦：crates.io 包名为 mycelium-agent-runtime，`use` 导入名保持 mycelium_runtime。
[lib]
name = "mycelium_runtime"

[lints]
workspace = true

[dependencies]
mycelium-agent-core.workspace = true
mycelium-agent-model.workspace = true
mycelium-agent-tools.workspace = true
async-trait.workspace = true
futures-core.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true
