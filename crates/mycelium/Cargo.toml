[package]
name = "mycelium"
description = "mycelium agent SDK 门面：统一 re-export、prelude 与端到端示例"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mycelium-core.workspace = true
mycelium-mcp.workspace = true
mycelium-model.workspace = true
mycelium-provider-openai = { workspace = true, optional = true }
mycelium-runtime.workspace = true
mycelium-tools.workspace = true

[features]
default = []
provider-openai = ["dep:mycelium-provider-openai"]

[[example]]
name = "agent_deepseek_mcp"
required-features = ["provider-openai"]

[[example]]
name = "live_integration"
required-features = ["provider-openai"]

[dev-dependencies]
futures-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true
